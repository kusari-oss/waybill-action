name: 'waybill SBOM Action'
description: 'Generate signed SBOMs with waybill: CycloneDX 1.6, SPDX 2.3 and SPDX 3.0.1, signed with Sigstore keyless by default'
author: 'kusari-oss'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Directory to scan (mutually exclusive with image). Defaults to "." when image is not set.'
    required: false
    default: ''
  image:
    description: 'Container image reference or tarball to scan (mutually exclusive with path)'
    required: false
    default: ''
  format:
    description: 'Comma-separated output formats: cyclonedx-json, spdx-2.3-json, spdx-3-json'
    required: false
    default: 'cyclonedx-json'
  output-file:
    description: 'Output path when a single format is requested. Default: sbom.json'
    required: false
    default: ''
  output-dir:
    description: 'Directory for the outputs when several formats are requested (sbom.cdx.json, sbom.spdx.json, sbom.spdx3.json)'
    required: false
    default: '.'
  sign:
    description: >-
      How to sign each SBOM: "keyless" (Sigstore, using the workflow identity; needs
      `permissions: id-token: write`), "key" (a static key, see sign-key), or "none"
    required: false
    default: 'keyless'
  sign-key:
    description: 'Path to a PEM private key, for sign: key'
    required: false
    default: ''
  sign-key-passphrase:
    description: 'Passphrase for an encrypted sign-key (pass it from a secret)'
    required: false
    default: ''
  waybill-version:
    description: 'waybill release to use: "latest" (the newest non-prerelease) or a tag such as v0.10.0'
    required: false
    default: 'latest'
  verify-provenance:
    description: >-
      Verify the waybill archive's SLSA provenance attestation against waybill's release
      workflow before running it (requires the gh CLI, present on GitHub-hosted runners)
    required: false
    default: 'true'
  include-dev:
    description: 'Include dev/build/test scoped dependencies (when false, runs waybill with --exclude-scope dev,build,test)'
    required: false
    default: 'false'
  offline:
    description: 'Disable all outbound network calls for enrichment'
    required: false
    default: 'false'
  image-src:
    description: 'Image source resolution order: comma-separated list of docker, podman, remote (e.g. docker,remote)'
    required: false
    default: ''
  args:
    description: 'Extra arguments for `waybill sbom scan`, one per line'
    required: false
    default: ''
  attest:
    description: >-
      Also publish the CycloneDX and SPDX 2.3 SBOMs as GitHub attestations (actions/attest),
      so `gh attestation verify --predicate-type ...` can check them. SPDX 3 is not
      attested: actions/attest does not accept it. Needs `permissions: id-token: write` and
      `attestations: write`, and a subject: attest-subject-path, or attest-subject-name
      with attest-subject-digest
    required: false
    default: 'false'
  attest-subject-path:
    description: 'Path, glob or newline-separated list of the artifacts the SBOM describes'
    required: false
    default: ''
  attest-subject-name:
    description: 'Name of the subject the SBOM describes, e.g. a fully qualified image name'
    required: false
    default: ''
  attest-subject-digest:
    description: 'Digest of that subject, sha256:<hex>'
    required: false
    default: ''
  attest-push-to-registry:
    description: 'Push the attestation to the image registry (needs an image subject, packages: write and artifact-metadata: write)'
    required: false
    default: 'false'
  upload-artifact:
    description: 'Upload the SBOMs and their signatures as a workflow artifact'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name of the uploaded artifact'
    required: false
    default: 'sbom'
  github-token:
    description: 'Token for resolving and downloading the waybill release and verifying its provenance'
    required: false
    default: ${{ github.token }}

outputs:
  sbom-path:
    description: 'Absolute path to the (first) generated SBOM'
    value: ${{ steps.run-waybill.outputs.sbom-path }}
  sbom-paths:
    description: 'Absolute paths of every generated SBOM, one per line'
    value: ${{ steps.run-waybill.outputs.sbom-paths }}
  signature-paths:
    description: 'Absolute paths of every detached signature (Sigstore bundle or DSSE envelope), one per line'
    value: ${{ steps.run-waybill.outputs.signature-paths }}
  signing-identity:
    description: 'For keyless signing, the certificate identity a verifier must expect'
    value: ${{ steps.run-waybill.outputs.signing-identity }}
  verify-command:
    description: 'For keyless signing, the cosign command that verifies the first SBOM'
    value: ${{ steps.run-waybill.outputs.verify-command }}
  waybill-version:
    description: 'The waybill release that was used'
    value: ${{ steps.run-waybill.outputs.waybill-version }}
  cyclonedx-path:
    description: 'Absolute path to the CycloneDX SBOM, if requested'
    value: ${{ steps.run-waybill.outputs.cyclonedx-path }}
  spdx23-path:
    description: 'Absolute path to the SPDX 2.3 SBOM, if requested'
    value: ${{ steps.run-waybill.outputs.spdx23-path }}
  spdx3-path:
    description: 'Absolute path to the SPDX 3 SBOM, if requested'
    value: ${{ steps.run-waybill.outputs.spdx3-path }}
  attestation-urls:
    description: 'With attest, the URL of each SBOM attestation, one per line'
    value: ${{ steps.attestations.outputs.urls }}

runs:
  using: 'composite'
  steps:
    - name: Download, verify and run waybill
      id: run-waybill
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_SIGN: ${{ inputs.sign }}
        INPUT_SIGN_KEY: ${{ inputs.sign-key }}
        WAYBILL_SIGN_KEY_PASSPHRASE: ${{ inputs.sign-key-passphrase }}
        INPUT_WAYBILL_VERSION: ${{ inputs.waybill-version }}
        INPUT_VERIFY_PROVENANCE: ${{ inputs.verify-provenance }}
        INPUT_INCLUDE_DEV: ${{ inputs.include-dev }}
        INPUT_OFFLINE: ${{ inputs.offline }}
        INPUT_IMAGE_SRC: ${{ inputs.image-src }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_ATTEST: ${{ inputs.attest }}
        INPUT_ATTEST_SUBJECT_PATH: ${{ inputs.attest-subject-path }}
        INPUT_ATTEST_SUBJECT_NAME: ${{ inputs.attest-subject-name }}
        INPUT_ATTEST_SUBJECT_DIGEST: ${{ inputs.attest-subject-digest }}
        INPUT_ATTEST_PUSH_TO_REGISTRY: ${{ inputs.attest-push-to-registry }}
      run: '"${GITHUB_ACTION_PATH}/scripts/run.sh"'

    # One attestation per format. A composite action cannot loop, so each
    # format has its own step, skipped when that format was not requested.
    # actions/attest accepts CycloneDX and SPDX 2.x only; SPDX 3 is refused
    # ("Unsupported SBOM format"), so it is not attested (run.sh warns).
    - name: Attest the CycloneDX SBOM
      id: attest-cyclonedx
      if: inputs.attest == 'true' && steps.run-waybill.outputs.cyclonedx-path != ''
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        sbom-path: ${{ steps.run-waybill.outputs.cyclonedx-path }}
        subject-path: ${{ inputs.attest-subject-path }}
        subject-name: ${{ inputs.attest-subject-name }}
        subject-digest: ${{ inputs.attest-subject-digest }}
        push-to-registry: ${{ inputs.attest-push-to-registry }}
        create-storage-record: ${{ inputs.attest-push-to-registry }}
        github-token: ${{ inputs.github-token }}

    - name: Attest the SPDX 2.3 SBOM
      id: attest-spdx23
      if: inputs.attest == 'true' && steps.run-waybill.outputs.spdx23-path != ''
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        sbom-path: ${{ steps.run-waybill.outputs.spdx23-path }}
        subject-path: ${{ inputs.attest-subject-path }}
        subject-name: ${{ inputs.attest-subject-name }}
        subject-digest: ${{ inputs.attest-subject-digest }}
        push-to-registry: ${{ inputs.attest-push-to-registry }}
        create-storage-record: ${{ inputs.attest-push-to-registry }}
        github-token: ${{ inputs.github-token }}

    - name: Collect attestation URLs
      id: attestations
      if: inputs.attest == 'true'
      shell: bash
      env:
        URLS: |
          ${{ steps.attest-cyclonedx.outputs.attestation-url }}
          ${{ steps.attest-spdx23.outputs.attestation-url }}
      run: |
        {
          echo "urls<<EOF_ATTEST_URLS"
          printf '%s\n' "${URLS}" | sed '/^[[:space:]]*$/d'
          echo "EOF_ATTEST_URLS"
        } >> "${GITHUB_OUTPUT}"

    - name: Upload SBOMs and signatures
      if: inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run-waybill.outputs.artifact-paths }}
        if-no-files-found: error
