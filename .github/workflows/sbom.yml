name: SBOM

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate project SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Sigstore keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate signed SBOM
        uses: ./
        with:
          path: '.'
          format: cyclonedx-json,spdx-3-json
          output-dir: project-sbom
          artifact-name: 'project-sbom'
