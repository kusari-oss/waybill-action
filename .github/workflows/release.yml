name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release, move the major tag
      id-token: write   # sign this action's own SBOM (Sigstore keyless)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate a signed SBOM of this action
        id: sbom
        uses: ./
        with:
          path: '.'
          format: cyclonedx-json,spdx-3-json
          output-dir: release-sbom
          upload-artifact: 'false'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
          files: |
            ${{ steps.sbom.outputs.sbom-paths }}
            ${{ steps.sbom.outputs.signature-paths }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update major version tag
        run: |
          MAJOR=$(echo "${GITHUB_REF_NAME}" | cut -d. -f1)
          git tag -f "${MAJOR}"
          git push origin "${MAJOR}" --force
