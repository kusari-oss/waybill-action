name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release, move the major tag
      id-token: write   # sign this action's own SBOM (Sigstore keyless)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Generate a signed SBOM of this action
        id: sbom
        uses: ./
        with:
          path: '.'
          format: cyclonedx-json,spdx-3-json
          output-dir: release-sbom
          upload-artifact: 'false'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            ${{ steps.sbom.outputs.sbom-paths }}
            ${{ steps.sbom.outputs.signature-paths }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update major version tag
        run: |
          MAJOR=$(echo "${GITHUB_REF_NAME}" | cut -d. -f1)
          git tag -f "${MAJOR}"
          git push origin "${MAJOR}" --force
